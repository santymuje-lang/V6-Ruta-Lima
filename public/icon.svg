<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="road" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>

  <!-- Pulse ring for GPS -->
  <circle cx="256" cy="270" r="170" fill="none" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.25"/>
  <circle cx="256" cy="270" r="120" fill="none" stroke="#38bdf8" stroke-width="6" stroke-opacity="0.4" stroke-dasharray="8 8"/>

  <!-- Stylized road curve -->
  <path d="M120 420 C180 340, 220 280, 256 160" fill="none" stroke="url(#road)" stroke-width="20" stroke-linecap="round" opacity="0.8"/>
  <path d="M392 420 C332 340, 292 280, 256 160" fill="none" stroke="url(#road)" stroke-width="20" stroke-linecap="round" opacity="0.8"/>
  <!-- Center dashed line -->
  <path d="M256 430 L256 220" fill="none" stroke="#ffffff" stroke-width="8" stroke-dasharray="16 16" opacity="0.7"/>

  <!-- GPS 3D Arrow Navigation Beacon -->
  <g transform="translate(256, 230)" filter="url(#glow)">
    <polygon points="0,-110 80,70 0,35 -80,70" fill="url(#arrow)"/>
    <polygon points="0,-110 0,35 -80,70" fill="#0284c7" opacity="0.8"/>
    <polygon points="0,-110 80,70 0,35" fill="#38bdf8" opacity="0.95"/>
    <circle cx="0" cy="15" r="12" fill="#ffffff"/>
  </g>

  <!-- RUTA LIMA Text Badge -->
  <rect x="96" y="430" width="320" height="48" rx="24" fill="#090d16" fill-opacity="0.85" stroke="#38bdf8" stroke-width="2"/>
  <text x="256" y="462" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">
    RUTA <tspan fill="#38bdf8">LIMA</tspan>
  </text>
</svg>
